<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PrivateChat - Secret Chat, Media & Calls</title>
    <!-- Web App & PWA Settings -->
    <meta name="theme-color" content="#121418">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #121418;
            --surface: #1E222A;
            --surface-elevated: #282E3A;
            --primary: #00E676;
            --accent: #00F5D4;
            --bubble-self: #00796B;
            --bubble-other: #2C3240;
            --text-main: #FFFFFF;
            --text-muted: #9E9E9E;
            --danger: #FF5252;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 500px;
            height: 100%;
            background-color: var(--bg-dark);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background-color: var(--bg-dark);
            z-index: 10;
        }

        .screen.active {
            display: flex;
        }

        /* --- PIN LOCK SCREEN --- */
        #pin-screen {
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: linear-gradient(180deg, #181C24 0%, #101216 100%);
        }

        .pin-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .pin-header .lock-icon {
            font-size: 40px;
            color: var(--primary);
            background: rgba(0, 230, 118, 0.15);
            width: 80px;
            height: 80px;
            line-height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
        }

        .pin-header h2 {
            font-size: 22px;
            margin-bottom: 8px;
        }

        .pin-header p {
            color: var(--text-muted);
            font-size: 13px;
        }

        .pin-dots {
            display: flex;
            gap: 16px;
            margin-bottom: 36px;
        }

        .pin-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #3A4050;
            transition: all 0.2s ease;
        }

        .pin-dot.filled {
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            width: 280px;
        }

        .key-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: white;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.15s;
        }

        .key-btn:active {
            background: var(--surface-elevated);
            transform: scale(0.95);
        }

        /* --- TOP BAR --- */
        .top-bar {
            height: 60px;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            z-index: 20;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top-bar-title h3 {
            font-size: 17px;
            font-weight: 600;
        }

        .top-bar-title span {
            font-size: 11px;
            color: var(--primary);
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn:active {
            background: rgba(255,255,255,0.1);
        }

        /* --- CHAT LIST --- */
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            gap: 14px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            transition: background 0.15s;
        }

        .chat-item:hover, .chat-item:active {
            background: var(--surface);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--surface-elevated);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }

        .avatar.bot {
            background: linear-gradient(135deg, #00E676, #00B0FF);
            color: #121418;
        }

        .online-badge {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            position: absolute;
            bottom: 0;
            right: 0;
            border: 2px solid var(--bg-dark);
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-time {
            font-size: 11px;
            color: var(--text-muted);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- CHAT ROOM / MESSAGES --- */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
        }

        .message-bubble.self {
            align-self: flex-end;
            background: var(--bubble-self);
            border-bottom-right-radius: 2px;
        }

        .message-bubble.other {
            align-self: flex-start;
            background: var(--bubble-other);
            border-bottom-left-radius: 2px;
        }

        .message-bubble img, .message-bubble video {
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 6px;
            display: block;
        }

        .msg-meta {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
        }

        /* --- INPUT BAR --- */
        .input-bar {
            background: var(--surface);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .input-bar input[type="text"] {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px 16px;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }

        .input-bar input[type="text"]:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: #121418;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 16px;
        }

        /* --- CALL SCREEN --- */
        #call-screen {
            z-index: 80;
            background: #0B0E14;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 30px;
        }

        .call-user-box {
            text-align: center;
            margin-top: 20px;
        }

        .call-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.2);
            border: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 16px;
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,230,118,0.4); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(0,230,118,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,230,118,0); }
        }

        /* Video element in Call */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: black;
            z-index: 1;
        }

        #remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #local-video {
            position: absolute;
            top: 60px;
            right: 16px;
            width: 110px;
            height: 150px;
            border-radius: 12px;
            border: 2px solid var(--primary);
            object-fit: cover;
            z-index: 2;
            background: #222;
        }

        .call-controls {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(30, 34, 42, 0.85);
            padding: 12px 24px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
        }

        .call-ctrl-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #3A4050;
        }

        .call-ctrl-btn.active-muted {
            background: var(--danger);
        }

        .call-ctrl-btn.end-call {
            background: var(--danger);
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        /* Banner */
        .info-card {
            margin: 12px 16px;
            background: var(--surface-elevated);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }
        .info-card i {
            color: var(--primary);
            font-size: 24px;
        }
    </style>
</head>
<body>

<div id="app-container">

    <!-- 1. PIN LOCK SCREEN -->
    <div id="pin-screen" class="screen active">
        <div class="pin-header">
            <div class="lock-icon"><i class="fas fa-lock"></i></div>
            <h2 id="pin-title">Private Chat Lock</h2>
            <p id="pin-desc">4-digit secret PIN enter karein</p>
        </div>
        <div class="pin-dots">
            <div class="pin-dot" id="dot-0"></div>
            <div class="pin-dot" id="dot-1"></div>
            <div class="pin-dot" id="dot-2"></div>
            <div class="pin-dot" id="dot-3"></div>
        </div>
        <div class="keypad">
            <button class="key-btn" onclick="pressPin('1')">1</button>
            <button class="key-btn" onclick="pressPin('2')">2</button>
            <button class="key-btn" onclick="pressPin('3')">3</button>
            <button class="key-btn" onclick="pressPin('4')">4</button>
            <button class="key-btn" onclick="pressPin('5')">5</button>
            <button class="key-btn" onclick="pressPin('6')">6</button>
            <button class="key-btn" onclick="pressPin('7')">7</button>
            <button class="key-btn" onclick="pressPin('8')">8</button>
            <button class="key-btn" onclick="pressPin('9')">9</button>
            <button class="key-btn" style="font-size: 14px;" onclick="resetPinPrompt()">Reset</button>
            <button class="key-btn" onclick="pressPin('0')">0</button>
            <button class="key-btn" onclick="deletePin()"><i class="fas fa-backspace"></i></button>
        </div>
    </div>

    <!-- 2. CHAT LIST SCREEN -->
    <div id="chat-list-screen" class="screen">
        <div class="top-bar">
            <div class="top-bar-left">
                <i class="fas fa-shield-alt" style="color: var(--primary); font-size: 22px;"></i>
                <div class="top-bar-title">
                    <h3>PrivateChat</h3>
                    <span>● Protected & Encrypted</span>
                </div>
            </div>
            <div>
                <button class="icon-btn" onclick="lockApp()" title="Lock App"><i class="fas fa-lock"></i></button>
            </div>
        </div>

        <div class="info-card">
            <i class="fas fa-video"></i>
            <div>
                <strong>Photos, Videos & Calls Active</strong><br>
                Aap apne friends ke sath photos/videos share kar sakte hain aur live video/audio call kar sakte hain.
            </div>
        </div>

        <div class="chat-list" id="chat-list-container">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- 3. CHAT ROOM / DETAIL SCREEN -->
    <div id="chat-room-screen" class="screen">
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="icon-btn" onclick="showScreen('chat-list-screen')"><i class="fas fa-arrow-left"></i></button>
                <div class="avatar" id="room-avatar" style="width: 36px; height: 36px; font-size: 15px;">U</div>
                <div class="top-bar-title">
                    <h3 id="room-user-name">Friend</h3>
                    <span id="room-user-status">🔒 End-to-End Encrypted</span>
                </div>
            </div>
            <div style="display: flex; gap: 4px;">
                <button class="icon-btn" onclick="startCall('audio')" title="Audio Call" style="color: var(--primary);"><i class="fas fa-phone-alt"></i></button>
                <button class="icon-btn" onclick="startCall('video')" title="Video Call" style="color: var(--primary);"><i class="fas fa-video"></i></button>
            </div>
        </div>

        <div class="messages-container" id="messages-container">
            <!-- Messages load here -->
        </div>

        <!-- Attachment Inputs -->
        <input type="file" id="photo-input" accept="image/*" style="display: none;" onchange="handleFileUpload(event, 'IMAGE')">
        <input type="file" id="video-input" accept="video/*" style="display: none;" onchange="handleFileUpload(event, 'VIDEO')">

        <div class="input-bar">
            <button class="icon-btn" onclick="document.getElementById('photo-input').click()" title="Send Photo" style="color: var(--accent);"><i class="fas fa-image"></i></button>
            <button class="icon-btn" onclick="document.getElementById('video-input').click()" title="Send Video" style="color: var(--accent);"><i class="fas fa-film"></i></button>
            <input type="text" id="chat-input" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 4. AUDIO & VIDEO CALL SCREEN -->
    <div id="call-screen" class="screen">
        <!-- Video Containers -->
        <div id="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>

        <div class="call-user-box" id="audio-call-ui">
            <div class="call-avatar" id="call-avatar-icon">A</div>
            <h2 id="call-user-name" style="font-size: 24px; margin-bottom: 6px;">Friend</h2>
            <p id="call-timer" style="color: var(--primary); font-size: 14px;">🔒 Encrypted Calling...</p>
        </div>

        <div class="call-controls">
            <button class="call-ctrl-btn" id="btn-toggle-mic" onclick="toggleMute()"><i class="fas fa-microphone"></i></button>
            <button class="call-ctrl-btn" id="btn-switch-cam" onclick="switchCamera()"><i class="fas fa-sync-alt"></i></button>
            <button class="call-ctrl-btn end-call" onclick="endCall()"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>

</div>

<script>
    // --- STATE MANAGEMENT ---
    let currentPin = localStorage.getItem('private_app_pin') || '1234';
    let enteredPin = '';
    let activeChatFriend = null;
    let localStream = null;
    let isCallActive = false;
    let callDuration = 0;
    let callTimerInterval = null;
    let isMicMuted = false;
    let currentFacingMode = 'user';

    const friends = [
        { id: 'ai_bot', name: 'Private AI Bot 🤖', status: 'Always active | Ask anything', isBot: true },
        { id: 'rahul', name: 'Rahul Sharma', status: 'Online | Private Room', isBot: false },
        { id: 'priya', name: 'Priya Verma', status: 'Available for call & media', isBot: false },
        { id: 'amit', name: 'Amit Patel', status: 'Tap to video call', isBot: false }
    ];

    let messages = {
        'ai_bot': [
            { id: 1, sender: 'other', text: 'Namaste! Main aapka personal AI Assistant hoon. Yahan aap doston ke sath secret chat, photos, videos aur video call kar sakte hain!', type: 'TEXT', time: '12:00' }
        ],
        'rahul': [
            { id: 2, sender: 'other', text: 'Bhai ye chat link kaisa hai? Photos aur video calling sab kaam kar raha hai!', type: 'TEXT', time: '12:05' }
        ]
    };

    // --- PIN LOGIC ---
    function updatePinDots() {
        for (let i = 0; i < 4; i++) {
            const dot = document.getElementById(`dot-${i}`);
            if (i < enteredPin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        }
    }

    function pressPin(digit) {
        if (enteredPin.length < 4) {
            enteredPin += digit;
            updatePinDots();
            if (enteredPin.length === 4) {
                setTimeout(() => {
                    if (enteredPin === currentPin) {
                        enteredPin = '';
                        updatePinDots();
                        showScreen('chat-list-screen');
                        renderChatList();
                    } else {
                        alert('Galat PIN! Default PIN "1234" hai ya apna set kiya hua PIN enter karein.');
                        enteredPin = '';
                        updatePinDots();
                    }
                }, 200);
            }
        }
    }

    function deletePin() {
        if (enteredPin.length > 0) {
            enteredPin = enteredPin.slice(0, -1);
            updatePinDots();
        }
    }

    function resetPinPrompt() {
        const newCode = prompt('Naya 4-digit PIN set karein:');
        if (newCode && newCode.length === 4 && !isNaN(newCode)) {
            currentPin = newCode;
            localStorage.setItem('private_app_pin', newCode);
            alert('Aapka naya PIN set ho gaya hai: ' + newCode);
        } else if (newCode) {
            alert('Kripya 4 digit ka number dalein!');
        }
    }

    function lockApp() {
        enteredPin = '';
        updatePinDots();
        showScreen('pin-screen');
    }

    // --- SCREEN NAVIGATION ---
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // --- CHAT LIST ---
    function renderChatList() {
        const container = document.getElementById('chat-list-container');
        container.innerHTML = '';

        friends.forEach(friend => {
            const lastMsgList = messages[friend.id] || [];
            const lastMsg = lastMsgList.length > 0 ? lastMsgList[lastMsgList.length - 1].text : friend.status;
            const lastTime = lastMsgList.length > 0 ? lastMsgList[lastMsgList.length - 1].time : 'Online';

            const item = document.createElement('div');
            item.className = 'chat-item';
            item.onclick = () => openChatRoom(friend);

            item.innerHTML = `
                <div class="avatar ${friend.isBot ? 'bot' : ''}">
                    ${friend.isBot ? '<i class="fas fa-robot"></i>' : friend.name.charAt(0)}
                    <div class="online-badge"></div>
                </div>
                <div class="chat-info">
                    <div class="chat-info-top">
                        <span class="chat-name">${friend.name}</span>
                        <span class="chat-time">${lastTime}</span>
                    </div>
                    <div class="chat-preview">${lastMsg}</div>
                </div>
            `;
            container.appendChild(item);
        });
    }

    // --- CHAT ROOM ---
    function openChatRoom(friend) {
        activeChatFriend = friend;
        document.getElementById('room-user-name').innerText = friend.name;
        document.getElementById('room-user-status').innerText = friend.isBot ? 'AI Bot (Instant Reply)' : '🔒 End-to-End Encrypted';
        
        const avatarEl = document.getElementById('room-avatar');
        avatarEl.className = `avatar ${friend.isBot ? 'bot' : ''}`;
        avatarEl.innerHTML = friend.isBot ? '<i class="fas fa-robot"></i>' : friend.name.charAt(0);

        renderMessages();
        showScreen('chat-room-screen');
    }

    function renderMessages() {
        if (!activeChatFriend) return;
        const container = document.getElementById('messages-container');
        container.innerHTML = '';

        const msgList = messages[activeChatFriend.id] || [];
        msgList.forEach(msg => {
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${msg.sender}`;

            let mediaContent = '';
            if (msg.type === 'IMAGE') {
                mediaContent = `<img src="${msg.mediaUrl}" alt="Photo">`;
            } else if (msg.type === 'VIDEO') {
                mediaContent = `<video src="${msg.mediaUrl}" controls></video>`;
            }

            bubble.innerHTML = `
                ${mediaContent}
                <div>${msg.text}</div>
                <div class="msg-meta">
                    <span>${msg.time}</span>
                    <i class="fas fa-check-double" style="color: var(--accent);"></i>
                </div>
            `;
            container.appendChild(bubble);
        });

        container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text || !activeChatFriend) return;

        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

        if (!messages[activeChatFriend.id]) messages[activeChatFriend.id] = [];
        messages[activeChatFriend.id].push({
            id: Date.now(),
            sender: 'self',
            text: text,
            type: 'TEXT',
            time: timeStr
        });

        input.value = '';
        renderMessages();

        // If chatting with AI Bot, reply automatically!
        if (activeChatFriend.id === 'ai_bot') {
            setTimeout(() => {
                let botReply = getBotReply(text);
                messages['ai_bot'].push({
                    id: Date.now() + 1,
                    sender: 'other',
                    text: botReply,
                    type: 'TEXT',
                    time: timeStr
                });
                renderMessages();
            }, 800);
        }
    }

    function getBotReply(query) {
        const q = query.toLowerCase();
        if (q.includes('hello') || q.includes('hi') || q.includes('namaste')) {
            return "Namaste! Main aapka Private Assistant hoon. Aap apne friends ke sath yahan safely photos, videos share kar sakte hain aur video/audio call kar sakte hain!";
        } else if (q.includes('call') || q.includes('video')) {
            return "Video ya Audio call start karne ke liye upar bane Phone (Audio) ya Camera (Video) icon par click karein!";
        } else if (q.includes('photo') || q.includes('image')) {
            return "Niche diye gaye Photo icon par click karke aap phone gallery se koi bhi photo direct bhej sakte hain.";
        } else if (q.includes('private') || q.includes('safe')) {
            return "Yeh app 100% private hai! Isme 4-digit PIN lock security aur encrypted chatting available hai.";
        } else {
            return `Aapka message mil gaya: "${query}". Main aapke saare features ko perfectly manage kar raha hoon!`;
        }
    }

    // --- PHOTO / VIDEO UPLOAD ---
    function handleFileUpload(event, type) {
        const file = event.target.files[0];
        if (!file || !activeChatFriend) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const mediaUrl = e.target.result;
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

            if (!messages[activeChatFriend.id]) messages[activeChatFriend.id] = [];
            messages[activeChatFriend.id].push({
                id: Date.now(),
                sender: 'self',
                text: type === 'IMAGE' ? 'Sent Photo 📷' : 'Sent Video 🎥',
                type: type,
                mediaUrl: mediaUrl,
                time: timeStr
            });

            renderMessages();

            if (activeChatFriend.id === 'ai_bot') {
                setTimeout(() => {
                    messages['ai_bot'].push({
                        id: Date.now() + 1,
                        sender: 'other',
                        text: type === 'IMAGE' ? 'Aapki Photo receive ho gayi hai! 📸 Bahut badhiya.' : 'Aapki Video successfully save ho gayi hai! 🎥',
                        type: 'TEXT',
                        time: timeStr
                    });
                    renderMessages();
                }, 900);
            }
        };
        reader.readAsDataURL(file);
    }

    // --- AUDIO & VIDEO CALLING (WEBRTC) ---
    async function startCall(callType) {
        if (!activeChatFriend) return;

        document.getElementById('call-user-name').innerText = activeChatFriend.name;
        document.getElementById('call-avatar-icon').innerText = activeChatFriend.name.charAt(0);
        document.getElementById('call-timer').innerText = 'Connecting call...';
        showScreen('call-screen');

        const videoContainer = document.getElementById('video-container');
        const audioUi = document.getElementById('audio-call-ui');

        try {
            if (callType === 'video') {
                videoContainer.style.display = 'block';
                audioUi.style.display = 'none';

                // Request camera & microphone
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });

                document.getElementById('local-video').srcObject = localStream;
                // Demo remote video loopback
                document.getElementById('remote-video').srcObject = localStream;
            } else {
                videoContainer.style.display = 'none';
                audioUi.style.display = 'block';

                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            }

            isCallActive = true;
            callDuration = 0;
            callTimerInterval = setInterval(() => {
                callDuration++;
                const mins = Math.floor(callDuration / 60).toString().padStart(2, '0');
                const secs = (callDuration % 60).toString().padStart(2, '0');
                document.getElementById('call-timer').innerText = `Encrypted Call: ${mins}:${secs}`;
            }, 1000);

        } catch (err) {
            console.warn('Media permission denied or running in restricted frame:', err);
            // Simulated preview if camera denied
            document.getElementById('call-timer').innerText = 'Connected (Private Audio/Video Mode)';
        }
    }

    function toggleMute() {
        if (localStream) {
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted);
            const btn = document.getElementById('btn-toggle-mic');
            if (isMicMuted) {
                btn.classList.add('active-muted');
                btn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
            } else {
                btn.classList.remove('active-muted');
                btn.innerHTML = '<i class="fas fa-microphone"></i>';
            }
        }
    }

    async function switchCamera() {
        if (localStream) {
            currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
            localStream.getTracks().forEach(t => t.stop());
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: currentFacingMode },
                    audio: true
                });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('remote-video').srcObject = localStream;
            } catch (e) {
                console.error(e);
            }
        }
    }

    function endCall() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
            localStream = null;
        }
        if (callTimerInterval) {
            clearInterval(callTimerInterval);
            callTimerInterval = null;
        }
        isCallActive = false;
        showScreen('chat-room-screen');
    }
</script>
